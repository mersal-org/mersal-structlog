default_language_version:
  python: "3.13"
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix", "--config", "pyproject.toml"]
      - id: ruff-format
        args: ["--config", "pyproject.toml"]
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: mise run type-check:ty
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mise run type-check:mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: basedpyright
        entry: mise run type-check:pyright
        language: system
        types: [python]
        pass_filenames: false
